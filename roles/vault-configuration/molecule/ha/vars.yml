---
vault_configuration_config_mode: apply
vault_configuration_config_management_owner: molecule-ha
vault_configuration_config_management_policy_prefix: vam-molecule-ha-
vault_configuration_token: '{{ (lookup(''file'', lookup(''env'', ''MOLECULE_EPHEMERAL_DIRECTORY'')
  + ''/private.json'') | from_json).token }}'
vault_configuration_passwords:
  alice: molecule-ha-test-password
vault_configuration_users:
- id: alice
  name: alice
  source: userpass
  auth_mount: userpass
  login: alice
vault_configuration_grants:
- id: personal-team
  subjects:
  - kind: user
    id: alice
  paths:
  - mount: apps
    path: payments/prod
    scope: subtree
    permissions:
    - read
    - write
vault_configuration_api_scheme: http
vault_configuration_api_port: '{{ (vault_configuration_test_address | default(''http://127.0.0.1:18211'')).split('':'')[-1]
  | int }}'
