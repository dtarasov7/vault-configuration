---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
- name: vault-configuration-ha-1
  image: hashicorp/vault:2.0.4@sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2
  pre_build_image: true
  command: vault server -config=/vault/config
  env:
    VAULT_LOCAL_CONFIG: '{"disable_mlock": true, "api_addr": "http://vault-configuration-ha-1:8200",
      "cluster_addr": "https://vault-configuration-ha-1:8201", "listener": {"tcp":
      {"address": "0.0.0.0:8200", "cluster_address": "0.0.0.0:8201", "tls_disable":
      true}}, "storage": {"raft": {"path": "/vault/file", "node_id": "vault-configuration-ha-1"}}}'
    SKIP_SETCAP: 'true'
    SKIP_CHOWN: 'true'
  published_ports:
  - 127.0.0.1:18211:8200
- name: vault-configuration-ha-2
  image: hashicorp/vault:2.0.4@sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2
  pre_build_image: true
  command: vault server -config=/vault/config
  env:
    VAULT_LOCAL_CONFIG: '{"disable_mlock": true, "api_addr": "http://vault-configuration-ha-2:8200",
      "cluster_addr": "https://vault-configuration-ha-2:8201", "listener": {"tcp":
      {"address": "0.0.0.0:8200", "cluster_address": "0.0.0.0:8201", "tls_disable":
      true}}, "storage": {"raft": {"path": "/vault/file", "node_id": "vault-configuration-ha-2"}}}'
    SKIP_SETCAP: 'true'
    SKIP_CHOWN: 'true'
  published_ports:
  - 127.0.0.1:18212:8200
- name: vault-configuration-ha-3
  image: hashicorp/vault:2.0.4@sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2
  pre_build_image: true
  command: vault server -config=/vault/config
  env:
    VAULT_LOCAL_CONFIG: '{"disable_mlock": true, "api_addr": "http://vault-configuration-ha-3:8200",
      "cluster_addr": "https://vault-configuration-ha-3:8201", "listener": {"tcp":
      {"address": "0.0.0.0:8200", "cluster_address": "0.0.0.0:8201", "tls_disable":
      true}}, "storage": {"raft": {"path": "/vault/file", "node_id": "vault-configuration-ha-3"}}}'
    SKIP_SETCAP: 'true'
    SKIP_CHOWN: 'true'
  published_ports:
  - 127.0.0.1:18213:8200
provisioner:
  name: ansible
  env:
    ANSIBLE_ASYNC_DIR: ${MOLECULE_PROJECT_DIRECTORY}/../../.work/ansible-async
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
    ANSIBLE_LOCAL_TEMP: ${MOLECULE_PROJECT_DIRECTORY}/../../.work/molecule-local
    ANSIBLE_REMOTE_TEMP: ${MOLECULE_PROJECT_DIRECTORY}/../../.work/molecule-remote
  playbooks:
    create: ../shared/create.yml
    destroy: ../shared/destroy.yml
  inventory:
    group_vars:
      all:
        vault_configuration_api_execution: controller
verifier:
  name: ansible
scenario:
  test_sequence:
  - dependency
  - destroy
  - syntax
  - create
  - prepare
  - converge
  - idempotence
  - verify
  - destroy
