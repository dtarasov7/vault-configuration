---
# Где выполняются API-запросы: controller — Ansible-контроллер, target — единственный выбранный host.
vault_configuration_api_execution: controller
# Схема подключения API Vault; https либо явно выбранный http.
vault_configuration_api_scheme: https
# Порт API Vault; hostname всегда берётся из inventory_hostname, а не ansible_host.
vault_configuration_api_port: 8200
# Соединяться с 127.0.0.1 только при execution: target; проверка TLS задаётся отдельно.
vault_configuration_api_use_loopback: false
# Режим: dry — план, apply — применение, export — экспорт, matrix — CSV назначенных прав KV v2.
vault_configuration_config_mode: dry
# Отчёт всегда на контроллере: YAML обязателен в dry, JSON в apply необязателен; пути от playbook_dir.
vault_configuration_config_report_destination: "{{ (playbook_dir ~ '/vault-configuration-' ~ inventory_hostname ~ '-dry.yml') if vault_configuration_config_mode == 'dry' else omit }}"
# Проверять доверие и соответствие имени TLS-сертификата сервера Vault.
vault_configuration_config_connection_validate_tls: true
# Файл CA на execution host; null — хранилище доверия Python по умолчанию.
vault_configuration_config_connection_ca_file: null
# Клиентский сертификат mTLS; null — не использовать; задаётся вместе с client_key.
vault_configuration_config_connection_client_cert: null
# Приватный ключ mTLS на execution host; null — не использовать.
vault_configuration_config_connection_client_key: null
# Таймаут запроса к API Vault в секундах; допустимо от 1 до 600.
vault_configuration_config_connection_timeout_seconds: 30
# Пути KV v2: отсутствующие движки создаются, существующие проверяются; удаление запрещено.
vault_configuration_config_mounts:
  - certs
  - infra
  - apps
  - cicd
  - users
# Принятие существующих объектов: [{kind, id, uuid}] либо [{kind, id, hash}].
vault_configuration_config_management_adoption: []
# Постоянный идентификатор владельца объектов; смена требует миграции.
vault_configuration_config_management_owner: platform-team
# Префикс ACL-политик; смена для управляемых политик требует миграции.
vault_configuration_config_management_policy_prefix: vam-platform-
# Разрешить grants на корень mount: path: "" с scope: subtree и корневые discovery_paths.
vault_configuration_config_safety_allow_mount_root: false
# Разрешить права destroy_versions/delete_metadata; сама роль секреты не уничтожает.
vault_configuration_config_safety_allow_destructive_grants: false
# Защищённые политики; root/default защищены независимо от переопределения списка.
vault_configuration_config_safety_protected_policies:
  - root
  - default
# Защищённые пользователи: inventory ID, имя или UUID; сущность автоматизации защищена всегда.
vault_configuration_config_safety_protected_entities: []
# Защищённые группы: inventory ID, имя или UUID.
vault_configuration_config_safety_protected_groups: []
# Ожидаемый digest плана из dry; null — не сверять; несовпадение блокирует применение.
vault_configuration_config_expected_plan_digest: null

# Один существующий административный токен; задайте через защищённый inventory/Ansible Vault.
vault_configuration_token: ""
# Пароли userpass по users[].id; on_create — при создании, always — явно перезаписывать каждый apply.
vault_configuration_passwords: {}
# Bind-пароли LDAP/AD по ldap[].id; нужны при создании, смене binddn либо bind_password_policy: always.
vault_configuration_ldap_passwords: {}
# Пользователи и алиасы; null — не управлять, [] — явно пустое желаемое состояние.
vault_configuration_users: null
# Внутренние/внешние группы; null — не управлять, [] — явно пустое состояние.
vault_configuration_groups: null
# Назначения политик субъектам; permissions: all/read_only/read_write либо список; null — сохранить назначения.
vault_configuration_grants: null
# Существующие AppRole/Kubernetes/JWT/OIDC roles; null — не управлять разделом.
vault_configuration_auth_roles: null
# Персональная политика (permissions также принимает алиасы): null — не управлять; {enabled: false} — снять назначения.
vault_configuration_personal_access: null
# LDAP/AD: [{id, auth_mount, config, ...}]; null — сохранить существующие настройки.
vault_configuration_ldap: null

# Область экспорта: managed — объекты владельца, scoped — выбранные объекты и зависимости.
vault_configuration_export_scope: managed
# YAML экспорта всегда на контроллере; относительный путь считается от playbook_dir.
vault_configuration_export_destination: ./vault-access-manager-export.yml
# Отдельный JSON-аудит; по умолчанию путь основного файла с суффиксом .audit.json.
vault_configuration_export_audit_destination: "{{ vault_configuration_export_destination ~ '.audit.json' }}"
# Допустить неполный экспорт; false — остановиться при неподдерживаемых объектах без записи файлов.
vault_configuration_export_allow_partial: false
# Фильтр KV mounts при экспорте; [] — использовать config_mounts.
vault_configuration_export_mounts: []
# Фильтр auth mounts при экспорте; [] — все обнаруженные auth mounts.
vault_configuration_export_auth_mounts: []
# Выбор/фильтр entities по имени или UUID; в scoped [] не выбирает их явно.
vault_configuration_export_entities: []
# Выбор/фильтр групп по имени или UUID; зависимости выбранных объектов добавляются автоматически.
vault_configuration_export_groups: []
# Выбор/фильтр политик по имени; [] в scoped не выбирает политики явно.
vault_configuration_export_policies: []
# Выбор/фильтр auth roles как auth_mount/name; [] в scoped не выбирает роли явно.
vault_configuration_export_auth_roles: []
# Выбор userpass accounts как auth_mount/login для scoped; [] — не выбирать явно.
vault_configuration_export_users: []
# Выбор LDAP/AD-конфигураций по auth mount для scoped; [] — не выбирать явно.
vault_configuration_export_ldap: []

# Источник матрицы: cluster — реальные назначения Vault, inventory — объявления без API и паролей.
vault_configuration_matrix_source: cluster
# CSV матрицы на контроллере; путь относительно playbook_dir; пояснения в <destination>.notes.txt.
vault_configuration_matrix_destination: ./vault-access-matrix.csv
