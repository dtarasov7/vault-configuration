---
- name: reconcile.yml - Plan or apply desired Vault configuration
  vault_configuration:
    passwords: '{{ vault_configuration_passwords }}'
    ldap_passwords: '{{ vault_configuration_ldap_passwords }}'
    users: '{{ vault_configuration_users }}'
    groups: '{{ vault_configuration_groups }}'
    grants: '{{ vault_configuration_grants }}'
    auth_roles: '{{ vault_configuration_auth_roles }}'
    personal_access: '{{ vault_configuration_personal_access }}'
    ldap: '{{ vault_configuration_ldap }}'
  delegate_to: '{{ vault_configuration_context.context.delegate }}'
  become: false
  vars:
    ansible_connection: '{{ hostvars[inventory_hostname].vault_configuration_context.context.connection }}'
    ansible_python_interpreter: '{{ hostvars[inventory_hostname].vault_configuration_context.context.interpreter }}'
  register: vault_configuration_result
  no_log: true
  ignore_errors: true
  changed_when: false
