---
- name: config.yml - Select export, matrix or reconciliation
  block:
  - name: config.yml - Read actual configuration for export
    ansible.builtin.include_tasks: export.yml
    when: vault_configuration_config_mode == 'export'
  - name: config.yml - Build read-only access matrix
    ansible.builtin.include_tasks: matrix.yml
    when: vault_configuration_config_mode == 'matrix'
  - name: config.yml - Plan or apply desired configuration
    ansible.builtin.include_tasks: reconcile.yml
    when: vault_configuration_config_mode not in ['export', 'matrix']
  module_defaults:
    vault_configuration:
      config: |-
        {{ {
          'mode': vault_configuration_config_mode,
          'connection': {
            'address': vault_configuration_context.context.address,
            'validate_tls': vault_configuration_config_connection_validate_tls,
            'ca_file': vault_configuration_config_connection_ca_file if vault_configuration_config_connection_ca_file is not none else omit,
            'client_cert': vault_configuration_config_connection_client_cert if vault_configuration_config_connection_client_cert is not none else omit,
            'client_key': vault_configuration_config_connection_client_key if vault_configuration_config_connection_client_key is not none else omit,
            'timeout_seconds': vault_configuration_config_connection_timeout_seconds,
            'allow_insecure_http': vault_configuration_api_scheme == 'http',
          },
          'management': {
            'owner': vault_configuration_config_management_owner,
            'policy_prefix': vault_configuration_config_management_policy_prefix,
            'adoption': vault_configuration_config_management_adoption,
          },
          'safety': {
            'allow_mount_root': vault_configuration_config_safety_allow_mount_root,
            'allow_destructive_grants': vault_configuration_config_safety_allow_destructive_grants,
            'protected_policies': vault_configuration_config_safety_protected_policies,
            'protected_entities': vault_configuration_config_safety_protected_entities,
            'protected_groups': vault_configuration_config_safety_protected_groups,
          },
          'mounts': vault_configuration_config_mounts,
          'expected_plan_digest': vault_configuration_config_expected_plan_digest if vault_configuration_config_expected_plan_digest is not none else omit,
        } }}
      # lookup is evaluated only in the selected branch; a bare Jinja variable may resolve eagerly.
      # RU: lookup вычисляется только в выбранной ветви; обычная Jinja-переменная может вычислиться заранее.
      token: "{{ '' if vault_configuration_config_mode == 'matrix' and vault_configuration_matrix_source == 'inventory' else lookup('vars', 'vault_configuration_token') }}"

- name: config.yml - Publish the sanitized result
  vault_configuration_report:
    context: '{{ vault_configuration_context.context }}'
    report: '{{ vault_configuration_result.report | default({''error'': ''Module failed before returning a public report''}) }}'

- name: config.yml - Report failure after publishing operation outcomes
  ansible.builtin.fail:
    msg: '{{ vault_configuration_result.report.error | default(''Vault configuration failed'') }}'
  when: vault_configuration_result is failed
