---
# Test environment: use the initial root token saved by hashicorp-vault.
# Alternatively, set vault_configuration_token to your existing administrative token.
vault_configuration_token: "{{ (lookup('ansible.builtin.file', vault_lab_init_file) | from_json).root_token }}"

# Choose the passwords of the local Vault accounts in this inventory.
vault_configuration_passwords:
  local-alice: ChangeMe
  local-bob: ChangeMe

# Bind DN is in 20-configuration.yml (vault_configuration_ldap[].config.binddn).
# Replace this with vault_configuration_ldap_passwords.test-ldap from the seeder's
# /root/vault-ldap-test/ldap-secrets.json, then protect this vars file with Ansible Vault.
vault_configuration_ldap_passwords:
  test-ldap: ChamgeMe
